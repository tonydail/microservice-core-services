# Shared infrastructure stack — start this before opening any devcontainer.
# Service app containers run in their own devcontainers and join this network.
#
# Usage:
#   docker network create microservices-net   (one-time)
#   docker compose -f infra/docker-compose.yml up -d

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: microservice-core-services-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"   # host access for tooling (e.g. Kafka UI, kafkacat)
    env_file:
      - ../environment/kafka.env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 30s
      timeout: 30s
      retries: 10
    networks:
      - microservices-net

  kafka-connect:
    image: debezium/connect:2.6
    container_name: microservice-core-services-kafka-connect
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "-X", "GET", "http://localhost:8083/connectors"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    env_file:
      - ../environment/kafka-connect.env
    networks:
      - microservices-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: microservice-core-services-kafka-ui
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ui/actuator/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 10s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
    - ../environment/kafka-ui.env
    networks:
      - microservices-net

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: microservice-core-services-cloudbeaver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8978/status"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 20s
    depends_on:
      nginx:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      kafka-ui:
        condition: service_healthy
    ports:
      - "8978:8978"
    volumes:
      - ../environment/cloudbeaver-workspace-data:/opt/cloudbeaver/workspace:cached
    networks:
      - microservices-net

  nginx:
    image: nginx:alpine
    container_name: microservice-core-services-api-gateway
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      kafka-ui:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - microservices-net
volumes:
    kafka_data:
    cloudbeaver_data:

networks:
  microservices-net:
    external: true
    name: microservices-net
