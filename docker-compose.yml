# Shared infrastructure stack — start this before opening any devcontainer.
# Service app containers run in their own devcontainers and join this network.
#
# Usage:
#   docker network create microservices-net   (one-time)
#   docker compose -f infra/docker-compose.yml up -d

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: microservice-core-services-zookeeper
    restart: unless-stopped
    env_file:
      - ../environment/zookeeper.env
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: microservice-core-services-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"   # host access for tooling (e.g. Kafka UI, kafkacat)
    env_file:
      - ../environment/kafka.env
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - microservices-net

  kafka-connect:
    image: debezium/connect:2.6
    container_name: microservice-core-services-kafka-connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    env_file:
      - ../environment/kafka-connect.env
    networks:
      - microservices-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: microservice-core-services-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    env_file:
    - ../environment/kafka-ui.env
    networks:
      - microservices-net

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: microservice-core-services-cloudbeaver
    restart: unless-stopped
    ports:
      - "8978:8978"
    volumes:
      - ../environment/cloudbeaver-workspace-data:/opt/cloudbeaver/workspace:cached
    networks:
      - microservices-net

  nginx:
    image: nginx:alpine
    container_name: microservice-core-services-api-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - microservices-net
volumes:
    cloudbeaver_data:

networks:
  microservices-net:
    external: true
    name: microservices-net
