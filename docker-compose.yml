# Shared infrastructure stack — start this before opening any devcontainer.
# Service app containers run in their own devcontainers and join this network.
#
# Usage:
#   docker network create microservices-net   (one-time)
#   docker compose -f infra/docker-compose.yml up -d

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: microservice-core-services-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - microservices-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: microservice-core-services-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"   # host access for tooling (e.g. Kafka UI, kafkacat)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - microservices-net

  kafka-connect:
    image: debezium/connect:2.6
    container_name: microservice-core-services-kafka-connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    env_file:
      - ../environment/container-hosts.env
      - ../environment/common-service-db.env
      - ../environment/microservice-users-service-db.env
      - ../environment/microservice-auth-service-db.env
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: debezium-configs
      OFFSET_STORAGE_TOPIC: debezium-offsets
      STATUS_STORAGE_TOPIC: debezium-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    networks:
      - microservices-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: microservice-core-services-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    networks:
      - microservices-net

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: microservice-core-services-cloudbeaver
    restart: unless-stopped
    ports:
      - "8978:8978"
    volumes:
      - ../environment/cloudbeaver-workspace-data:/opt/cloudbeaver/workspace
    networks:
      - microservices-net

  nginx:
    image: nginx:alpine
    container_name: microservice-core-services-api-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - microservices-net
volumes:
    cloudbeaver_data:

networks:
  microservices-net:
    external: true
    name: microservices-net
